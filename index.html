<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <link rel="stylesheet" href="./index.css" />
  <script src="./main.js"></script>
  <body></body>
</html>
<div>
  <div class="candidate_box" style="display: flex">
    <span style="margin-left: auto; font-size: 2rem"
      >아이엠파인 SD팀 지원자 조민</span
    >
  </div>

  <section id="">
    <div class="graph_box">
      <p>1.그래프</p>
      <div style="display: flex">
        <div id="y-axis"></div>
        <div class="graph-wrapper">
          <div id="graph"></div>
          <div id="x-axis"></div>
        </div>
      </div>
    </div>
    <div class="update_box" style="display: flex; flex-direction: column">
      <p>2.값 편집</p>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>값</th>
            <th></th>
          </tr>
        </thead>
        <tbody class="values_box"></tbody>
      </table>

      <button type="button" style="margin-left: auto" onclick="updateValue()">
        Apply
      </button>
    </div>
    <div class="add_box">
      <p>3.값 추가</p>
      <div class="">
        <input id="input_id" type="number" placeholder="ID" />
        <input id="input_value" type="number" placeholder="VALUE" />
        <button type="button" onclick="addValue()">Add</button>
      </div>
    </div>
    <div class="detail_Box">
      <p>4.값 고급 편집</p>
      <div class="">
        <textarea id="detail_area"></textarea>
      </div>
      <button type="button" onclick="update_detailBox()">Apply</button>
    </div>
  </section>
</div>
